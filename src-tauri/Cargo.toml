[package]
name = "bounce-defense"
version = "0.1.0"
description = "Physics-driven roguelite build-crafting game: your ball is the character."
authors = ["bazimazi"]
license = "MIT"
repository = "https://github.com/bazimazi/BounceDefense"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows (cargo#8519).
name = "bounce_defense_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
